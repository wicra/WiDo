<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=1280">
<!-- Page du test complet (Réglages → Test) : les situations que WiDo doit savoir piloter à la télécommande. -->
<script>
// Passerelle factice : les scripts de WiDo s'y branchent comme sur une vraie page, ses messages sont gardés pour le test.
window.__widoMsgs = [];
window.WiDoBridge = { postMessage: function (m) { window.__widoMsgs.push(String(m)); } };
</script>
<style>
body{margin:0;background:#111;color:#eee;font:16px sans-serif}
.grid a{display:inline-block;width:180px;height:60px;margin:8px;background:#333;color:#fff}
h2{margin:24px 8px 8px}
.row{display:flex;overflow-x:auto;gap:12px;padding:8px;scroll-snap-type:x mandatory}
.row a{flex:0 0 220px;height:130px;background:#2a3b6b;color:#fff;scroll-snap-align:start}
.swiper{position:relative;overflow:hidden;width:900px;margin:8px}
.swiper-wrapper{display:flex;transition:transform .25s;}
.swiper-slide{flex:0 0 220px;height:130px;margin-right:12px;background:#6b2a5b;display:block;color:#fff}
.swiper-button-next,.swiper-button-prev{position:absolute;top:50px;width:30px;height:30px;background:#fff;z-index:2}
.swiper-button-next{right:0}.swiper-button-prev{left:0}
.cards{display:flex;overflow-x:auto;gap:12px;padding:8px}
.cards div{flex:0 0 200px;height:150px;background:#2a6b4b;color:#fff;cursor:pointer}
#vid{width:400px;height:225px;background:#000;display:block;margin:8px}
#adwrap{margin:8px}
.ad-box{width:300px;height:80px;background:#a33;color:#fff}
form{margin:8px}
</style></head>
<body>
<div class="grid" id="grid"></div>
<h2>Rangée défilante</h2>
<div class="row" id="row"></div>
<h2>Carrousel animé</h2>
<div class="swiper" id="sw"><div class="swiper-wrapper" id="swt"></div>
<button class="swiper-button-prev" aria-label="Précédent"></button><button class="swiper-button-next" aria-label="Suivant"></button></div>
<h2>Cartes sans lien</h2>
<div class="cards" id="cards"></div>
<form id="f" onsubmit="window.__widoSubmitted=document.getElementById('q').value;return false"><input id="q" type="search" placeholder="Recherche"></form>
<video id="vid" muted></video>
<div id="adwrap"><div class="ad-box" id="ad" style="display:block !important">Publicité</div></div>
<script>
(function () {
  var g = document.getElementById('grid');
  for (var i = 0; i < 6; i++) { var a = document.createElement('a'); a.href = '#g' + i; a.id = 'g' + i; a.textContent = 'Lien ' + i; g.appendChild(a); }
  var r = document.getElementById('row');
  for (var j = 0; j < 14; j++) { var c = document.createElement('a'); c.href = '#c' + j; c.id = 'c' + j; c.textContent = 'Affiche ' + j; r.appendChild(c); }
  var t = document.getElementById('swt');
  for (var k = 0; k < 10; k++) { var s = document.createElement('a'); s.href = '#s' + k; s.id = 's' + k; s.className = 'swiper-slide'; s.textContent = 'Diapo ' + k; t.appendChild(s); }
  // Des affiches en <div> avec un clic JavaScript (pas de lien) : seul le curseur « main » les signale.
  var cs = document.getElementById('cards');
  window.__widoCardClicks = [];
  for (var m = 0; m < 12; m++) {
    var d = document.createElement('div'); d.className = 'MovieCard_root'; d.id = 'k' + m;
    d.innerHTML = '<span>Film ' + m + '</span>';
    d.addEventListener('click', function () { window.__widoCardClicks.push(this.id); });
    cs.appendChild(d);
  }
  // Un carrousel animé minimal : les boutons déplacent la piste par transform, comme Swiper.
  var pos = 0;
  var next = document.querySelector('.swiper-button-next'), prev = document.querySelector('.swiper-button-prev');
  function go(d) {
    pos = Math.max(0, Math.min(10 - 3, pos + d));
    t.style.transform = 'translate3d(' + (-pos * 232) + 'px,0,0)';
    // Comme Swiper : les boutons se grisent aux bouts.
    next.classList.toggle('swiper-button-disabled', pos >= 10 - 3);
    prev.classList.toggle('swiper-button-disabled', pos <= 0);
  }
  prev.classList.add('swiper-button-disabled');
  next.addEventListener('click', function () { go(1); });
  prev.addEventListener('click', function () { go(-1); });
  // Recrée l'encadré publicitaire autrement (autre emballage, style qui le force visible), comme une autre page du site.
  window.__widoSelfTestRebuild = function () {
    // Sans identifiant : seule une signature par les classes le retrouve.
    document.getElementById('adwrap').innerHTML = '<section class="promo"><div class="ad-box" style="display:block !important">Publicité</div></section>';
  };
})();
</script>
</body></html>
