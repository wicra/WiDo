name: Release

# Pousse un tag `vX.Y.Z` pour publier : la CI construit, signe et publie l'APK
# avec sa somme SHA-256, que l'app vérifie avant d'installer une mise à jour.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew :core:test

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.WIDO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret WIDO_KEYSTORE_BASE64 absent (voir docs/RELEASING.md)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wido.jks"
          echo "WIDO_KEYSTORE_PATH=$RUNNER_TEMP/wido.jks" >> "$GITHUB_ENV"

      - name: Construire l'APK signé
        env:
          WIDO_KEYSTORE_PASSWORD: ${{ secrets.WIDO_KEYSTORE_PASSWORD }}
          WIDO_KEY_ALIAS: ${{ secrets.WIDO_KEY_ALIAS }}
          WIDO_KEY_PASSWORD: ${{ secrets.WIDO_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :app:assembleRelease \
            -Pwido.versionName="$VERSION" \
            -Pwido.versionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "wido-${GITHUB_REF_NAME}.apk"

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="wido-${GITHUB_REF_NAME}.apk"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "WiDo ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "sha256: ${SHA}"
