name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests du module core
        run: ./gradlew :core:test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests de la logique du curseur aimanté
        run: node scripts/js/snap-core.test.mjs
      - name: APK debug
        run: |
          # Les erreurs Gradle sont répétées en annotation : lisibles sans télécharger les journaux.
          if ! ./gradlew :app:assembleDebug --console=plain > build.log 2>&1; then
            MSG=$({ grep -E '^e: ' build.log; grep -A25 'What went wrong' build.log; grep -E 'Caused by' build.log; } | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::$MSG"
            exit 1
          fi
      - name: APK release (R8, signée avec la clé debug)
        run: |
          if ! ./gradlew :app:assembleRelease --console=plain > release.log 2>&1; then
            MSG=$({ grep -E '^e: |ERROR:|Missing class' release.log; grep -A25 'What went wrong' release.log; } | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Release build failed::$MSG"
            exit 1
          fi
      - name: Tests Android (Robolectric) et captures d'écran
        run: |
          if ! ./gradlew :app:testDebugUnitTest --console=plain > tests.log 2>&1; then
            MSG=$({ grep -E '^e: |FAILED|Exception' tests.log; grep -A25 'What went wrong' tests.log; } | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android tests failed::$MSG"
            exit 1
          fi
      - name: Analyse Android (lint)
        run: |
          if ! ./gradlew :app:lintDebug --console=plain > lint.log 2>&1; then
            MSG=$({ grep -E 'Error:|error:' app/build/reports/lint-results-debug.txt 2>/dev/null; grep -E ': Error: ' lint.log; grep -A25 'What went wrong' lint.log; } | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Lint failed::$MSG"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wido-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wido-captures-ecran
          path: app/build/outputs/screens/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wido-lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
